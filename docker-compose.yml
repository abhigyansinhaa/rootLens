services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port — only backend/worker need Redis; access via compose network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rootLens_db
      POSTGRES_USER: rootLens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see env.example}
    # No host port — only backend/worker need Postgres; access via compose network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootLens_user -d rootLens_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — see env.example}
      DATABASE_URL: postgresql+psycopg2://rootLens_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rootLens_db
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_TIMEOUT_S: ${ANALYSIS_TIMEOUT_S:-1800}
    command:
      - "sh"
      - "-c"
      - "until alembic upgrade head; do echo 'DB not ready, retrying in 3s...'; sleep 3; done && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 30"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-8g}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — see env.example}
      DATABASE_URL: postgresql+psycopg2://rootLens_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rootLens_db
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_TIMEOUT_S: ${ANALYSIS_TIMEOUT_S:-1800}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    command: ["rq", "worker", "default", "--url", "redis://redis:6379/0"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
